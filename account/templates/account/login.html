<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login Page</title>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/account/css/login.css/">


</head>
<body>
  <div class="background">
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  <form method="post">

{% if messages %}
  <ul>
    {% for message in messages %}
      <li style="color: red;">{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}
<h3><a href="/" class="signup-link">Back to HomePage</a></h3>

    <h3>Login Here</h3>
    {% csrf_token %}
    {% if error_message %}
    <p class="error-text">{{ error_message }}</p>
    {% endif %}

    <label for="username">Username</label>
    <input type="text" placeholder="Enter Username" id="username" name="username" required>

    <label for="password">Password</label>
    <div class="password-wrapper">
      <input type="password" placeholder="Enter password" id="password" name="pass" required>
      <i class="fas fa-eye" id="togglePassword"></i>
    </div>

    <button type="submit">Log In</button>

    <div class="social">
      <div class="go"><i class="fab fa-google"></i> Google</div>
      <div class="fb"><i class="fab fa-facebook"></i> Facebook</div>
    </div>

    <p class="signup-text">
      Don't have an account?
      <a href="{% url 'SignupPage' %}" class="signup-link">Sign Up</a>
    </p>
  </form>

<script src="/static/js/login.js/"></script>
</body>
</html>
